<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLauncher · Liquid Glass</title><style>
:root{--accent:#51caff;--glass:.17;--blur:24px;--scale:1;--ease:cubic-bezier(.2,1.35,.35,1)}*{box-sizing:border-box}body{margin:0;background:#06152b;color:#f7fbff;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif;overflow:hidden}#wall{position:fixed;inset:0;background:radial-gradient(ellipse at 18% 22%,#0879bd 0,transparent 37%),radial-gradient(ellipse at 80% 78%,#086b83 0,transparent 35%),linear-gradient(135deg,#06152b,#102c60 55%,#071b36);z-index:-2}#wall:after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 30%,#9beaff22 45%,transparent 54%),radial-gradient(ellipse at 50% 50%,#1b8aff33,transparent 60%);filter:blur(50px);animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(5%,3%) scale(1.12)}}.grain{position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}.top{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);text-align:center}.time{font-size:clamp(42px,5.5vw,76px);font-weight:300;letter-spacing:-3px;text-shadow:0 4px 30px #0005}.date{font-size:17px;color:#d5eaffc9;letter-spacing:.04em;margin-top:0}.weather{position:absolute;right:5%;top:7%;font-size:15px;color:#d7eeffb9}.main{position:absolute;left:7%;right:7%;top:29%;bottom:17%;display:flex;flex-direction:column;justify-content:center;gap:26px}.section{font-size:17px;color:#d5eaffbd;margin:0 0 2px 4px;letter-spacing:.04em}.apps{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:18px}.app{height:142px;border:1px solid #ffffff36;background:linear-gradient(145deg,#ffffff25,#ffffff0a);backdrop-filter:blur(var(--blur)) saturate(1.4);border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;box-shadow:inset 0 1px #ffffff55,0 12px 30px #0002;transition:transform calc(.35s / var(--scale)) var(--ease),border-color .25s,background .25s;outline:none;cursor:pointer}.app .ico{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#ffffff45,#ffffff12);box-shadow:inset 0 1px #ffffff88,0 6px 18px #0002}.app span{font-size:15px;color:#f3f8ff}.app.focused,.app:focus{transform:translateY(-8px) scale(1.045);border:2px solid #b5ecff;background:linear-gradient(145deg,#ffffff45,#ffffff1c);box-shadow:0 0 0 5px #6bcfff2b,0 18px 40px #0004,inset 0 1px #fff9}.dock{display:flex;gap:12px;align-items:center;align-self:flex-start;padding:10px 15px;border-radius:28px;background:#ffffff19;border:1px solid #ffffff38;backdrop-filter:blur(var(--blur));box-shadow:inset 0 1px #ffffff55,0 12px 35px #0003}.dock button,.gear{border:0;color:white;background:transparent;padding:12px 20px;border-radius:18px;font-size:15px;cursor:pointer}.dock button:focus,.dock button.active{background:#ffffff27;outline:1px solid #ffffff52}.gear{position:absolute;right:5%;bottom:7%;width:62px;height:62px;border:1px solid #ffffff42;background:#ffffff1c;backdrop-filter:blur(var(--blur));border-radius:50%;font-size:24px}.hint{position:absolute;left:7%;bottom:8%;font-size:12px;color:#d9edff88}.glass{background:rgba(255,255,255,var(--glass));border:1px solid #ffffff55;backdrop-filter:blur(var(--blur)) saturate(1.5);box-shadow:inset 0 1px 1px #ffffff80,0 20px 60px #0004}.scrim{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:.35s}.panel{position:fixed;right:22px;top:22px;bottom:22px;width:min(390px,calc(100vw - 44px));border-radius:30px;padding:26px;transform:translateX(calc(100% + 40px));transition:transform .55s var(--ease);z-index:3}.open .panel{transform:translateX(0)}.open .scrim{opacity:1;pointer-events:auto}.panel h2{font-size:25px;margin:0 0 6px}.muted{color:#d4e8f6a8;font-size:13px;margin-bottom:24px}.close{float:right;border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:50%;width:36px;height:36px;font-size:20px}.setting{margin:22px 0}.setting label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:11px;color:#f3f8ff}.setting input[type=range]{width:100%;accent-color:var(--accent)}.swatches{display:flex;gap:12px}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #ffffff80;cursor:pointer}.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff20;font-size:14px}.toggle input{accent-color:var(--accent);width:18px;height:18px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#102c49dd;border:1px solid #ffffff50;border-radius:18px;padding:12px 18px;transition:.3s;backdrop-filter:blur(18px)}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.apps{grid-template-columns:repeat(3,1fr)}.main{top:28%;bottom:15%}.app{height:105px}.app .ico{width:45px;height:45px;font-size:23px}.weather{display:none}}
</style></head><body><div id="wall"></div><div class="grain"></div><header class="top"><div class="time" id="time">05:33</div><div class="date" id="date">Понедельник, 23 ноября</div></header><div class="weather">◌ &nbsp; Android TV · Home</div><main class="main"><div><p class="section">Избранное</p><div class="apps" id="apps"><button class="app focused"><div class="ico">▶</div><span>YouTube</span></button><button class="app"><div class="ico">▣</div><span>Netflix</span></button><button class="app"><div class="ico">♫</div><span>Музыка</span></button><button class="app"><div class="ico">◈</div><span>Кино</span></button><button class="app"><div class="ico">⌘</div><span>Игры</span></button><button class="app"><div class="ico">＋</div><span>Приложения</span></button></div></div><div><p class="section">Медиатека</p><nav class="dock"><button class="active">⌂ &nbsp; Главная</button><button>▦ &nbsp; Приложения</button><button>◷ &nbsp; Недавние</button><button>♡ &nbsp; Избранное</button></nav></div></main><div class="hint">← → Навигация &nbsp; · &nbsp; Enter — выбрать &nbsp; · &nbsp; Esc — назад / настройки</div><button class="gear" id="gear" aria-label="Настройки">⚙</button><div class="scrim" id="scrim"></div><aside class="panel glass" id="panel"><button class="close" id="close">×</button><h2>Настройки</h2><div class="muted">Liquid Glass · Персонализация</div><div class="setting"><label>Акцентный цвет</label><div class="swatches"><button class="swatch" data-color="#51caff" style="background:#51caff"></button><button class="swatch" data-color="#b69cff" style="background:#b69cff"></button><button class="swatch" data-color="#65e0bb" style="background:#65e0bb"></button><button class="swatch" data-color="#ffb66d" style="background:#ffb66d"></button><button class="swatch" data-color="#ff7f9f" style="background:#ff7f9f"></button></div></div><div class="setting"><label>Прозрачность стекла <output id="op">17%</output></label><input id="opacity" type="range" min="8" max="35" value="17"></div><div class="setting"><label>Размытие <output id="bl">24px</output></label><input id="blur" type="range" min="8" max="36" value="24"></div><div class="setting"><label>Скорость анимации <output id="sp">1.0×</output></label><input id="speed" type="range" min="6" max="16" value="10"></div><div class="toggle">Пружинные анимации <input type="checkbox" id="spring" checked></div><div class="toggle">Показывать дату <input type="checkbox" id="showdate" checked></div><div class="toggle">Центральные часы <input type="checkbox" checked disabled></div></aside><div class="toast" id="toast">Настройки применены</div><script>
const $=s=>document.querySelector(s), root=document.documentElement;function tick(){let d=new Date();$('#time').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,1000);
const panel=()=>document.body.classList.toggle('open');$('#gear').onclick=panel;$('#close').onclick=panel;$('#scrim').onclick=panel;document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('open');return}if(document.body.classList.contains('open'))return;let a=[...document.querySelectorAll('.app')],i=a.findIndex(x=>x.classList.contains('focused'));if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();a[i].classList.remove('focused');i=(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length;a[i].classList.add('focused')}if(e.key==='Enter')toast('Открытие приложения — демонстрационный режим');if(e.key.toLowerCase()==='s')panel()});
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1700)}document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{root.style.setProperty('--accent',b.dataset.color);toast('Цвет интерфейса изменён')});$('#opacity').oninput=e=>{root.style.setProperty('--glass',e.target.value/100);$('#op').textContent=e.target.value+'%'};$('#blur').oninput=e=>{root.style.setProperty('--blur',e.target.value+'px');$('#bl').textContent=e.target.value+'px'};$('#speed').oninput=e=>{let v=e.target.value/10;root.style.setProperty('--scale',v);$('#sp').textContent=v.toFixed(1)+'×'};$('#spring').onchange=e=>{root.style.setProperty('--ease',e.target.checked?'cubic-bezier(.2,1.35,.35,1)':'ease-out');toast('Анимации обновлены')};$('#showdate').onchange=e=>$('#date').style.display=e.target.checked?'block':'none';document.querySelectorAll('.app').forEach((b,i)=>b.onclick=()=>{document.querySelector('.focused')?.classList.remove('focused');b.classList.add('focused');toast('Выбрано: '+b.innerText.trim())});
</script></body></html>
