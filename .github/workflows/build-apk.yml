имя: ошибка

на:
  workflow_dispatch:
  толкать:
    ветви: [основной, мастер]

работа:
  строить:
    имя: Android APK
    наезжает: убунту-22.04

    шаги:
      - имя: Скачать исходный код
        использует: действия/checkout@v4

      - имя: Устааановиь Java 17
        использует: действия/setup-java@v4
        с:
          распределение: темурин
          java-версия: '17'

      - имя: Установить Флаттер
        использует: субосито/flutter-action@v2
        с:
          флаттер-версия: '3.7.5'
          канал: стабильный
          кэш: истинный

      - имя: Найти Android SDK
        оболочка: баш
        бегать: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          эсли [ -z "$SDKMANAGER" ]; тогда
            echo "sdkmanager не найден в $SDK_ROOT"
            найти "$SDK_ROOT" -name sdkmanager -type f -print || true
            выход 1
          фи
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - имя: Установить Android-платформу и инструменты сборки
        оболочка: баш
        бегать: |
          да | "$SDKMANAGER" --лицензии || правда
          "$SDKMANAGER" "планменные устройства" "планменные;android-33" "планменные устройства;33.0.2"

      - имя: Создать нассстройки Android
        оболочка: баш
        бегать: |
          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > android/local.properties
          printf "sdk.dir=%s\n" "$SDK_ROOT" >> android/local.properties

      - имя: Скачать Gradle 7.4
        оболочка: баш
        бегать: |
          curl -fsSL https://services.gradle.org/distributions/gradle-7.4-bin.zip -o/tmp/gradle.zip
          скачать -q/tmp/gradle.zip -d/tmp

      - имя: Подробнее Gradle Wrapper
        оболочка: баш
        бегать: |
          /tmp/gradle-7.4/bin/gradle -p оболочка Android --gradle-version 7.4
          chmod +x android/gradlew

      - имя: Получить зависимости Флаттер
        бегать: флаттер паб получить

      - имя: Отправлять APK
        бегать: флаттер сборка apk --отладка

      - имя: Загрузить APK
        использует: действия/upload-artifact@v4
        с:
          имя: LiquidLach-APK
          путь: ссылка/app/outputs/flutter-apk/app-debug.apk
          если-файлы-не-найдены: ошибка
