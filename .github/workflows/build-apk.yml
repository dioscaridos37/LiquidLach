name: Собрать LiquidLach APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.5'
          channel: stable
          cache: true

      - name: Найти Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден"
            find "$SDK_ROOT" -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Установить Android platform и build tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Создать настройки Android
        shell: bash
        run: |
          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > android/local.properties
          printf "sdk.dir=%s\n" "$SDK_ROOT" >> android/local.properties

      - name: Скачать Gradle 7.4
        shell: bash
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-7.4-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Создать Gradle Wrapper
        shell: bash
        run: |
          /tmp/gradle-7.4/bin/gradle \
            -p android \
            wrapper \
            --gradle-version 7.4
          chmod +x android/gradlew

      - name: Получить зависимости Flutter
        run: flutter pub get

      - name: Собрать APK
        run: flutter build apk --debug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidLach-APK
          path: 
