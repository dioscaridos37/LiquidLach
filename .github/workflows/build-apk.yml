name: Собрать LiquidLach APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.5'
          channel: stable
          cache: true

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Android platform и build tools
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

          yes | sdkmanager --licenses || true

      - name: Создать настройки Android
        shell: bash
        run: |
          echo "Flutter: $FLUTTER_ROOT"
          echo "Android SDK: $ANDROID_SDK_ROOT"

          mkdir -p android

          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > android/local.properties
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" >> android/local.properties

          cat android/local.properties

      - name: Скачать Gradle 7.4
        shell: bash
        run: |
          curl -L \
            https://services.gradle.org/distributions/gradle-7.4-bin.zip \
            -o /tmp/gradle-7.4.zip

          unzip -q /tmp/gradle-7.4.zip -d /tmp

          /tmp/gradle-7.4/bin/gradle --version

      - name: Создать Gradle Wrapper 7.4
        shell: bash
        run: |
          /tmp/gradle-7.4/bin/gradle \
            -p android \
            wrapper \
            --gradle-version 7.4

          chmod +x android/gradlew

          android/gradlew --version

      - name: Получить зависимости Flutter
        run: |
          flutter pub get

      - name: Проверить Flutter
        run: |
          flutter doctor -v

      - name: Собрать APK
        run: |
          flutter build apk --debug

      - name: Переименовать APK
        shell: bash
        run: |
          cp \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/LiquidLach.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidLach-APK
          path: build/app/outputs/flutter-apk/LiquidLach.apk
          if-no-files-found: error
